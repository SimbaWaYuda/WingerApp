# Local S3-compatible storage for image smoke tests.
# Usage (from apps/api):
#   docker compose -f docker-compose.minio.yml up -d
#   .\scripts\minio-smoke.ps1
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: winger
      MINIO_ROOT_PASSWORD: wingersecret
    volumes:
      - winger-minio-data:/data

volumes:
  winger-minio-data:
